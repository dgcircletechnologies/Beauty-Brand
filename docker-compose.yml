services:
  postgres:
    image: postgres:17
    container_name: skincare-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: skincare
      POSTGRES_PASSWORD: skincare
      POSTGRES_DB: skincare_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skincare -d skincare_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: development
    container_name: skincare-backend-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://skincare:skincare@postgres:5432/skincare_db
      CORS_ORIGIN: http://localhost:5000,http://127.0.0.1:5000,http://localhost:3001,http://127.0.0.1:3001
    ports:
      - "3000:3000"
    command: sh -c "npm ci && npx prisma migrate deploy && npm run start:dev"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - backend_dist:/app/dist
      - backend_generated:/app/generated
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: development
    container_name: skincare-frontend-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      API_INTERNAL_BASE_URL: http://backend:3000/api/v1
    ports:
      - "5000:3000"
    command: sh -c "npm ci && npm run dev"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - backend

volumes:
  postgres_dev_data:
  backend_node_modules:
  backend_dist:
  backend_generated:
  frontend_node_modules:
  frontend_next:
