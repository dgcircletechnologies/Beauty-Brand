name: Skincare CI/CD
on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - main

concurrency:
  group: skincare-production
  cancel-in-progress: false

jobs:
  # ============================================
  # CI - Verify Docker images build
  # ============================================
  ci:
    name: CI - Build Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # CD - Deploy to Hostinger VPS
  # ============================================
  deploy:
    name: CD - Deploy to Hostinger
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_PORT" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "VPS_HOST, VPS_USER, VPS_PORT, and VPS_SSH_KEY secrets are required."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/skincare
          chmod 600 ~/.ssh/skincare
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy application
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_PORT" ]; then
            echo "VPS_HOST, VPS_USER, and VPS_PORT secrets are required."
            exit 1
          fi

          APP_DIR="${VPS_APP_DIR:-/root/skincare}"

          missing_app_secrets=""
          for secret_name in \
            POSTGRES_PASSWORD \
            JWT_ACCESS_SECRET \
            JWT_REFRESH_SECRET \
            SMTP_HOST \
            SMTP_USER \
            SMTP_PASS \
            CLOUDINARY_CLOUD_NAME \
            CLOUDINARY_API_KEY \
            CLOUDINARY_API_SECRET
          do
            if [ -z "${!secret_name}" ]; then
              missing_app_secrets="$missing_app_secrets $secret_name"
            fi
          done

          if [ -n "$missing_app_secrets" ]; then
            echo "Missing required production secrets:$missing_app_secrets"
            exit 1
          fi

          tar \
            --exclude='.git' \
            --exclude='backend/node_modules' \
            --exclude='frontend/node_modules' \
            --exclude='backend/dist' \
            --exclude='frontend/.next' \
            -czf /tmp/skincare.source.tar.gz \
            .

          {
            printf '%s\n' "POSTGRES_USER=skincare"
            printf '%s\n' "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
            printf '%s\n' "POSTGRES_DB=skincare_db"
            printf '%s\n' "POSTGRES_PORT=5433"
            printf '%s\n' "BACKEND_PORT=4000"
            printf '%s\n' "FRONTEND_PORT=5001"
            printf '%s\n' "CORS_ORIGIN=http://localhost:5001"
            printf '%s\n' "APP_FRONTEND_URL=http://localhost:5001"
            printf '%s\n' "NEXT_PUBLIC_API_BASE_URL=/api/v1"
            printf '%s\n' "API_INTERNAL_BASE_URL=http://backend:3000/api/v1"
            printf '%s\n' "JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}"
            printf '%s\n' "JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}"
            printf '%s\n' "REFRESH_TOKEN_HASH_SECRET=${JWT_REFRESH_SECRET}"
            printf '%s\n' "ONE_TIME_TOKEN_HASH_SECRET=${JWT_REFRESH_SECRET}"
            printf '%s\n' "JWT_ACCESS_EXPIRES_IN_SECONDS=900"
            printf '%s\n' "JWT_REFRESH_EXPIRES_IN_SECONDS=604800"
            printf '%s\n' "EMAIL_VERIFICATION_EXPIRES_IN_MINUTES=60"
            printf '%s\n' "SMTP_HOST=${SMTP_HOST}"
            printf '%s\n' "SMTP_PORT=587"
            printf '%s\n' "SMTP_USER=${SMTP_USER}"
            printf '%s\n' "SMTP_PASS=${SMTP_PASS}"
            printf '%s\n' "SMTP_FROM="
            printf '%s\n' "SUPPORT_EMAIL="
            printf '%s\n' "CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}"
            printf '%s\n' "CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}"
            printf '%s\n' "CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}"
            printf '%s\n' "CLOUDINARY_PRODUCT_FOLDER=bluewave/products"
            printf '%s\n' "CLOUDINARY_CATEGORY_FOLDER=bluewave/categories"
            printf '%s\n' "RAZORPAY_KEY_ID="
            printf '%s\n' "RAZORPAY_KEY_SECRET="
            printf '%s\n' "RAZORPAY_WEBHOOK_SECRET="
          } > /tmp/skincare.production.env

          ssh \
            -i ~/.ssh/skincare \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            "mkdir -p '$APP_DIR'"

          scp \
            -i ~/.ssh/skincare \
            -P "$VPS_PORT" \
            /tmp/skincare.source.tar.gz \
            "$VPS_USER@$VPS_HOST:$APP_DIR/source.tar.gz"

          scp \
            -i ~/.ssh/skincare \
            -P "$VPS_PORT" \
            /tmp/skincare.production.env \
            "$VPS_USER@$VPS_HOST:$APP_DIR/.env"

          ssh \
            -i ~/.ssh/skincare \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" "APP_DIR='$APP_DIR' bash -s" << 'DEPLOY'
          set -e
          echo "===== Starting deployment ====="
          cd "$APP_DIR"
          echo "===== Unpack latest source ====="
          tar -xzf source.tar.gz
          rm -f source.tar.gz
          echo "===== Build & recreate containers ====="
          docker compose -f docker-compose.prod.yml build
          docker compose -f docker-compose.prod.yml up -d
          echo "===== Clean up dangling images ====="
          docker image prune -f
          echo "===== Deployment successful ====="
          DEPLOY
